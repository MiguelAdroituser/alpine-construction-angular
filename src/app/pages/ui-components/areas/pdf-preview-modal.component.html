<h2 mat-dialog-title>PDF Preview</h2>

<mat-dialog-content class="pdf-preview-content">
  <div class="preview-container">
    
    <!-- Options column -->
    <div class="options-panel">
      <h4>Options</h4>

      <!-- 👇 Wrap all checkboxes inside a form -->
      <form [formGroup]="optionsForm">
        <div *ngFor="let craft of data.crafts">
          <mat-checkbox [formControlName]="craft">{{ craft }}</mat-checkbox>
        </div>
      </form>
    </div>

    <!-- PDF Preview -->
    <div class="iframe-panel">
      <iframe [src]="data.pdfUrl | safeUrl" width="100%" height="100%"></iframe>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onApplyChanges()">Apply Changes</button>
</mat-dialog-actions>
